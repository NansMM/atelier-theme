# Atelier — "Chaux & olive"
#
# Colour means state. A room is neutral at rest, honey ("lit") when its lights are on,
# terracotta ("warn") when a door or gate is open. Nothing is tinted for decoration.
# The interactive colour (primary) is olive by day and a light neutral by night: at night,
# the only colour that matters is the one of the lit house.
#
# Two layers:
#   1. tokens `atelier-*`, defined once per mode under `modes:` — the only place holding colour values;
#   2. the mapping below, wiring Home Assistant, Mushroom and Bubble Card variables to those tokens.
# Home Assistant exposes every key as a CSS custom property, so custom cards may read `var(--atelier-lit-bg)`.
Atelier:
  # One type family. Sora is not bundled: add the Google Fonts resource (see README) or accept the fallback.
  ha-font-family-body: "Sora, 'Avenir Next', 'Helvetica Neue', sans-serif"
  ha-font-family-heading: "Sora, 'Avenir Next', 'Helvetica Neue', sans-serif"
  primary-font-family: "Sora, 'Avenir Next', 'Helvetica Neue', sans-serif"
  paper-font-common-base_-_font-family: "Sora, 'Avenir Next', 'Helvetica Neue', sans-serif"
  mdc-typography-font-family: "Sora, 'Avenir Next', 'Helvetica Neue', sans-serif"

  # Hierarchical radii: card 16, dialog 26, control 10, chip and badge 999.
  ha-card-border-radius: "16px"
  ha-card-border-width: "0"
  ha-card-border-color: "transparent"
  ha-dialog-border-radius: "26px"
  ha-badge-border-radius: "999px"
  ha-chip-border-radius: "999px"
  feature-border-radius: "10px"
  control-slider-border-radius: "10px"
  control-button-border-radius: "10px"
  control-select-border-radius: "10px"
  ha-view-sections-column-gap: "8px"
  ha-view-sections-row-gap: "8px"
  ha-section-grid-column-gap: "8px"
  ha-section-grid-row-gap: "8px"

  # Surfaces and text
  primary-background-color: "var(--atelier-bg)"
  secondary-background-color: "var(--atelier-bg2)"
  lovelace-background: "var(--atelier-bg)"
  card-background-color: "var(--atelier-card)"
  ha-card-background: "var(--atelier-card)"
  ha-card-box-shadow: "var(--atelier-shadow)"
  primary-text-color: "var(--atelier-text)"
  secondary-text-color: "var(--atelier-text2)"
  disabled-text-color: "var(--atelier-text2)"
  text-primary-color: "var(--atelier-on-primary)"
  divider-color: "var(--atelier-divider)"
  primary-color: "var(--atelier-primary)"
  accent-color: "var(--atelier-primary)"
  light-primary-color: "var(--atelier-primary)"
  dark-primary-color: "var(--atelier-primary)"
  state-icon-color: "var(--atelier-text2)"

  # Named colours used by tile cards (color: amber, …)
  amber-color: "var(--atelier-c-amber)"
  orange-color: "var(--atelier-c-orange)"
  deep-orange-color: "var(--atelier-c-orange)"
  red-color: "var(--atelier-c-red)"
  green-color: "var(--atelier-c-green)"
  blue-color: "var(--atelier-c-blue)"
  light-blue-color: "var(--atelier-c-cyan)"
  cyan-color: "var(--atelier-c-cyan)"
  teal-color: "var(--atelier-c-teal)"
  purple-color: "var(--atelier-c-purple)"
  deep-purple-color: "var(--atelier-c-purple)"
  indigo-color: "var(--atelier-c-purple)"
  pink-color: "var(--atelier-c-pink)"
  grey-color: "var(--atelier-c-grey)"

  # Mushroom (mush-rgb-*)
  mush-rgb-amber: "var(--atelier-rgb-amber)"
  mush-rgb-orange: "var(--atelier-rgb-orange)"
  mush-rgb-deep-orange: "var(--atelier-rgb-orange)"
  mush-rgb-red: "var(--atelier-rgb-red)"
  mush-rgb-green: "var(--atelier-rgb-green)"
  mush-rgb-blue: "var(--atelier-rgb-blue)"
  mush-rgb-cyan: "var(--atelier-rgb-cyan)"
  mush-rgb-teal: "var(--atelier-rgb-teal)"
  mush-rgb-purple: "var(--atelier-rgb-purple)"
  mush-rgb-indigo: "var(--atelier-rgb-purple)"
  mush-rgb-pink: "var(--atelier-rgb-pink)"
  mush-rgb-grey: "var(--atelier-rgb-grey)"
  mush-rgb-disabled: "var(--atelier-rgb-disabled)"
  mush-rgb-state-media-player: "var(--atelier-rgb-pink)"

  # Bubble Card: pop-up background = page background, buttons = card background
  bubble-pop-up-main-background-color: "var(--primary-background-color)"
  bubble-main-background-color: "var(--ha-card-background)"
  bubble-accent-color: "var(--primary-color)"
  bubble-pop-up-border-radius: "26px"
  bubble-border-radius: "16px"
  bubble-button-border-radius: "16px"
  bubble-sub-button-border-radius: "999px"
  bubble-secondary-background-color: "var(--secondary-background-color)"
  bubble-icon-background-color: "var(--secondary-background-color)"

  modes:
    # Night — the default when the device prefers a dark scheme.
    dark:
      atelier-bg: "#101a14"
      atelier-bg2: "#141f18"
      atelier-card: "#19251e"
      atelier-shadow: "none"
      atelier-text: "#e5e8e1"
      atelier-text2: "#9fa99d"
      atelier-divider: "rgba(255,255,255,0.07)"
      atelier-dash: "rgba(159,169,157,0.45)"
      atelier-primary: "#e5e8e1"
      atelier-on-primary: "#101a14"
      atelier-inverse-bg: "#e5e8e1"
      atelier-inverse-fg: "#101a14"
      atelier-lit-bg: "#342c12"
      atelier-lit-fg: "#e6c05a"
      atelier-lit-shadow: "none"
      atelier-warn-bg: "#3a1e18"
      atelier-warn-fg: "#ff9e8c"
      atelier-control: "#3d4f43"
      atelier-post-bg: "#0b120e"
      atelier-post-fg: "#e5e8e1"
      atelier-post-fg2: "#9fa99d"
      atelier-post-surface: "rgba(229,232,225,0.08)"
      atelier-post-bar-bg: "#e5e8e1"
      atelier-post-bar-fg: "#101a14"
      atelier-c-amber: "#e6c05a"
      atelier-c-orange: "#e8a468"
      atelier-c-red: "#f28f80"
      atelier-c-green: "#a4c48c"
      atelier-c-blue: "#8fa3b8"
      atelier-c-cyan: "#86b7c8"
      atelier-c-teal: "#7fbfb3"
      atelier-c-purple: "#a99ce8"
      atelier-c-pink: "#d98fb3"
      atelier-c-grey: "#8f9a90"
      atelier-rgb-amber: "230, 192, 90"
      atelier-rgb-orange: "232, 164, 104"
      atelier-rgb-red: "242, 143, 128"
      atelier-rgb-green: "164, 196, 140"
      atelier-rgb-blue: "143, 163, 184"
      atelier-rgb-cyan: "134, 183, 200"
      atelier-rgb-teal: "127, 191, 179"
      atelier-rgb-purple: "169, 156, 232"
      atelier-rgb-pink: "217, 143, 179"
      atelier-rgb-grey: "143, 154, 144"
      atelier-rgb-disabled: "159, 169, 157"
    # Day — lime-wash background, white cards, olive as the interactive colour.
    light:
      atelier-bg: "#eceee6"
      atelier-bg2: "#e3e6dd"
      atelier-card: "#ffffff"
      atelier-shadow: "0 1px 2px rgba(26,31,25,0.04), 0 12px 28px -22px rgba(26,31,25,0.30)"
      atelier-text: "#1a1f19"
      atelier-text2: "#596157"
      atelier-divider: "rgba(26,31,25,0.10)"
      atelier-dash: "rgba(89,97,87,0.45)"
      atelier-primary: "#4a6639"
      atelier-on-primary: "#f4f6ef"
      atelier-inverse-bg: "#4a6639"
      atelier-inverse-fg: "#f4f6ef"
      atelier-lit-bg: "#f7e2a0"
      atelier-lit-fg: "#5a4410"
      atelier-lit-shadow: "var(--atelier-shadow)"
      atelier-warn-bg: "#f6d2c6"
      atelier-warn-fg: "#7d2f1f"
      atelier-control: "#4a6639"
      atelier-post-bg: "#4a6639"
      atelier-post-fg: "#f4f6ef"
      atelier-post-fg2: "rgba(244,246,239,0.86)"
      atelier-post-surface: "rgba(244,246,239,0.14)"
      atelier-post-bar-bg: "#ffffff"
      atelier-post-bar-fg: "#4a6639"
      atelier-c-amber: "#9a7a1c"
      atelier-c-orange: "#b4652c"
      atelier-c-red: "#b0432f"
      atelier-c-green: "#4a6639"
      atelier-c-blue: "#4d6478"
      atelier-c-cyan: "#3f7a8c"
      atelier-c-teal: "#3f8577"
      atelier-c-purple: "#5f5a86"
      atelier-c-pink: "#a05473"
      atelier-c-grey: "#7a817a"
      atelier-rgb-amber: "154, 122, 28"
      atelier-rgb-orange: "180, 101, 44"
      atelier-rgb-red: "176, 67, 47"
      atelier-rgb-green: "74, 102, 57"
      atelier-rgb-blue: "77, 100, 120"
      atelier-rgb-cyan: "63, 122, 140"
      atelier-rgb-teal: "63, 133, 119"
      atelier-rgb-purple: "95, 90, 134"
