name: Validate

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: theme

  theme:
    name: Theme consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml yamllint
      - run: yamllint themes/ .github/
      - run: python scripts/check_theme.py
